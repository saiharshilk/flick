<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="flick">
  <meta name="theme-color" content="#2b2826" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e9e6e1" media="(prefers-color-scheme: light)">
  <title>flick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      /* warm charcoal room (dark) */
      --bg: #2b2826;
      --surface: #353230;
      --line: #46413d;
      --text: #ece5da;
      --muted: #9d958a;
      --blue: #5b9bef;
      --stamp: #ff8a2b;
      --paper: #f6f0e4;
      --paper-ink: #5a4a3c;

      --serif: "Nanum Myeongjo", Georgia, serif;
      --hand: "Permanent Marker", "Marker Felt", cursive;
      --mono: "Nanum Gothic Coding", ui-monospace, Menlo, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        /* concrete (light) */
        --bg: #e9e6e1;
        --surface: #dedad3;
        --line: #c4beb5;
        --text: #24211e;
        --muted: #6e675f;
        --blue: #0466c8;
        --stamp: #e8700f;
        --paper: #fbf9f5;
        --paper-ink: #2c2824;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 400 17px/1.6 var(--serif);
      padding: max(28px, env(safe-area-inset-top)) 16px calc(116px + env(safe-area-inset-bottom));
    }
    main { max-width: 640px; margin: 0 auto; text-align: center; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

    /* ---------- header ---------- */
    h1 { font: 800 3rem/1 var(--serif); letter-spacing: -0.04em; margin: 0; }
    .tagline { font: 400 .85rem/1.2 var(--mono); color: var(--muted); margin: 10px 0 0; }

    /* ---------- the camera (hero + photo picker) ---------- */
    .camera {
      position: relative; display: block; width: 216px; height: 140px; margin: 34px auto 14px;
      cursor: pointer; border: 0; padding: 0; background: none;
    }
    .camera input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 0; }
    .camera .body {
      position: absolute; inset: 14px 0 0; border-radius: 16px;
      border-radius: 10px;
      background: linear-gradient(160deg, #4a4a4c 0%, #2c2c2e 45%, #1c1c1d 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -3px 0 rgba(0,0,0,.4), 0 12px 26px rgba(0,0,0,.35);
      transition: transform .12s ease;
    }
    .camera .shutter {
      position: absolute; top: 4px; right: 34px; width: 34px; height: 14px; border-radius: 6px 6px 2px 2px;
      background: linear-gradient(#5a5a5c, #2a2a2b); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .12s ease;
    }
    .camera .flash {
      position: absolute; top: 26px; left: 16px; width: 40px; height: 20px; border-radius: 4px;
      background: linear-gradient(135deg, #fffef6, #d9d6c9 60%, #f3f1e6);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.12);
    }
    .camera .lens {
      position: absolute; top: 36px; left: 50%; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #0d1220 0 30%, #23304a 31% 40%, #0c0f16 41% 54%, #5c5c5e 55% 62%, #9b9b9d 63% 70%, #3a3a3c 71% 100%);
      box-shadow: 0 2px 4px rgba(0,0,0,.3), inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .camera .lens::after {
      content: ''; position: absolute; top: 24px; left: 28px; width: 12px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.55); transform: rotate(-30deg);
    }
    .camera .led { position: absolute; top: 30px; right: 20px; width: 7px; height: 7px; border-radius: 50%; background: #e2463a; box-shadow: 0 0 6px #ff5a4a; }
    .camera .brand { position: absolute; bottom: 10px; right: 16px; font: .95rem/1 var(--hand); color: #8d8d90; }
    .camera .screen {
      position: absolute; bottom: 10px; left: 14px; padding: 2px 6px; border-radius: 3px;
      background: #1d2a22; font: 700 .7rem/1.3 var(--mono); color: #3b4d40; letter-spacing: .04em;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.6);
    }
    .camera .screen.on { color: var(--stamp); text-shadow: 0 0 4px rgba(255,138,43,.7); }
    .camera:hover .body { transform: translateY(-2px); }
    .camera:active .body { transform: translateY(1px); }
    .camera:active .shutter { transform: translateY(3px); }
    .camera:focus-within { outline: 2px solid var(--blue); outline-offset: 6px; border-radius: 12px; }

    .prompt { color: var(--muted); font-size: .95rem; margin: 0; }

    /* ---------- options ---------- */
    .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 26px 0 30px; }
    .pill {
      font: 400 .85rem/1 var(--mono); color: var(--text); background: var(--surface);
      border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 14px; cursor: pointer; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .pill[aria-pressed="true"] { border-color: var(--text); }
    .pill:disabled { color: var(--muted); cursor: default; border-style: dashed; background: transparent; }
    .pill .dot { width: 8px; height: 8px; border-radius: 1px; border: 1.5px solid var(--muted); }
    .pill[aria-pressed="true"] .dot { background: var(--stamp); border-color: var(--stamp); box-shadow: 0 0 6px var(--stamp); }

    /* ---------- prints ---------- */
    .prints { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 16px; text-align: left; }
    @media (min-width: 620px) { .prints { grid-template-columns: repeat(3, 1fr); } }
    .print {
      position: relative; background: var(--paper); padding: 7px 7px 0; border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.16);
      transform: rotate(var(--tilt, 0deg));
    }
    .print .photo { position: relative; background: #1b1918; overflow: hidden; }
    .print img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .print .developing {
      aspect-ratio: 3 / 4; display: grid; place-items: center;
      font: 400 .8rem/1 var(--mono); color: #8e857a;
      background: linear-gradient(180deg, #2a2624, #3a3330);
    }
    .print .caption {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 4px 2px 6px; min-height: 36px;
    }
    .print .date { font: .95rem/1 var(--hand); color: var(--paper-ink); white-space: nowrap; }
    .print .original { font: .95rem/1 var(--hand); color: var(--paper-ink); white-space: nowrap; display: none; }
    .print.showing-original .original { display: inline; }
    .print.showing-original .date { display: none; }
    .print .save {
      font: 400 .72rem/1 var(--mono); color: var(--paper-ink); background: transparent;
      border: 1.5px solid #cfc7bb; border-radius: 5px; padding: 6px 9px; cursor: pointer; font-weight: 700;
    }
    .print .err { padding: 18px 8px; font-size: .85rem; color: #b2433a; background: var(--paper); }

    .hint { font: 400 .8rem/1.2 var(--mono); color: var(--muted); margin: 28px 0 0; }

    /* ---------- bottom bar ---------- */
    .bar {
      position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; gap: 6px; padding: 6px; border-radius: 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }
    .bar[hidden] { display: none; }
    .bar button {
      font: 700 .9rem/1 var(--mono); border: 0; border-radius: 8px; padding: 14px 18px; cursor: pointer;
      background: transparent; color: var(--muted); white-space: nowrap;
    }
    .bar .primary { background: var(--bg); color: var(--text); padding: 14px 22px; }
    .bar .primary b { color: var(--blue); font-weight: 700; }
    .bar .primary:disabled { cursor: default; color: var(--muted); }

    /* ---------- camera flash ---------- */
    .flashbulb { position: fixed; inset: 0; background: #fffdf2; pointer-events: none; opacity: 0; z-index: 10; }
    .flashbulb.go { animation: flash .5s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 8% { opacity: .85; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flashbulb.go { animation: none; }
      .camera .body, .camera .shutter { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <h1>flick</h1>
  <p class="tagline" id="tagline">your photos, but from 2006</p>

  <label class="camera" aria-label="Pick photos">
    <input id="picker" type="file" accept="image/*" multiple>
    <span class="shutter" aria-hidden="true"></span>
    <span class="body" aria-hidden="true">
      <span class="flash"></span>
      <span class="led"></span>
      <span class="lens"></span>
      <span class="screen" id="screen">'-- -- --</span>
      <span class="brand">flick</span>
    </span>
  </label>
  <p class="prompt" id="prompt">tap the camera to pick photos</p>

  <div class="options">
    <button class="pill" data-filter="digicam" aria-pressed="true" type="button">digicam</button>
    <button class="pill" data-filter="moody" aria-pressed="false" type="button">moody</button>
    <button class="pill" id="stamp" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span>date stamp</button>
  </div>

  <div id="prints" class="prints"></div>
  <p id="hint" class="hint" hidden>hold a print to see the original</p>

</main>

<div id="bar" class="bar" hidden>
  <button id="clear" type="button">clear</button>
  <button id="saveAll" class="primary" type="button">save</button>
</div>

<div class="flashbulb" id="flashbulb" aria-hidden="true"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
