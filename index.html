<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flick">
  <meta name="theme-color" content="#0d0b0e">
  <title>Flick</title>
  <style>
    :root {
      --bg: #0d0b0e; --card: #18151a; --line: #2b2630; --text: #f4eff5; --muted: #9b92a0;
      --accent: #ff6ad5; --stamp: #ff8c2a;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f7f4f7; --card: #ffffff; --line: #e6e0e7; --text: #19141b; --muted: #6f6673;
        --accent: #d4329f; --stamp: #e06a10;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.45 -apple-system, system-ui, sans-serif;
      padding: max(20px, env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
    }
    main { max-width: 720px; margin: 0 auto; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    h1 { font-size: 2rem; margin: 0; letter-spacing: -0.03em; }
    .stamp { font: 600 .95rem ui-monospace, Menlo, monospace; color: var(--stamp); text-shadow: 0 0 8px color-mix(in srgb, var(--stamp) 60%, transparent); }

    .pick {
      display: block; width: 100%; padding: 18px; border-radius: 16px; border: 0;
      background: var(--accent); color: #fff; font: 700 1.05rem/1 inherit; text-align: center; cursor: pointer;
    }
    input[type=file] { display: none; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 18px; }
    .chip {
      border: 1.5px solid var(--line); background: var(--card); color: var(--text);
      padding: 8px 14px; border-radius: 999px; font: 600 .9rem inherit; cursor: pointer;
    }
    .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .chip:disabled { opacity: .45; cursor: default; }
    .spacer { flex: 1; }
    .toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; cursor: pointer; user-select: none; }
    .switch { position: relative; width: 44px; height: 26px; border-radius: 13px; background: var(--line); transition: background .2s; flex: none; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle input:checked + .switch { background: var(--stamp); }
    .toggle input:checked + .switch::after { transform: translateX(18px); }
    .toggle input { display: none; }

    .empty { color: var(--muted); text-align: center; padding: 48px 12px; border: 1.5px dashed var(--line); border-radius: 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .tile { position: relative; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
    .tile img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .tile .busy { aspect-ratio: 3/4; display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
    .tile .badge {
      position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 999px;
      background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; font-weight: 600; opacity: 0; transition: opacity .15s;
    }
    .tile.showing-original .badge { opacity: 1; }
    .tile .save {
      position: absolute; right: 8px; top: 8px; border: 0; border-radius: 999px; padding: 6px 12px;
      background: rgba(0,0,0,.6); color: #fff; font: 600 .8rem inherit; cursor: pointer; backdrop-filter: blur(6px);
    }
    .tile .err { padding: 16px; color: #f87171; font-size: .85rem; }
    .hint { color: var(--muted); font-size: .8rem; text-align: center; margin: 12px 0 0; }

    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
      display: flex; gap: 10px; justify-content: center;
    }
    .bar[hidden] { display: none; }
    .bar button { flex: 1; max-width: 360px; padding: 15px; border-radius: 14px; border: 0; font: 700 1rem inherit; cursor: pointer; }
    .bar .primary { background: var(--text); color: var(--bg); }
    .bar .primary:disabled { opacity: .5; }
    .bar .ghost { flex: 0 0 auto; background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 15px 18px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Flick</h1>
    <span class="stamp" id="today"></span>
  </header>

  <label class="pick">Choose photos
    <input id="picker" type="file" accept="image/*" multiple>
  </label>

  <div class="controls">
    <button class="chip" aria-pressed="true">Digicam</button>
    <button class="chip" disabled>More soon</button>
    <span class="spacer"></span>
    <label class="toggle">Date stamp
      <input type="checkbox" id="stamp"><span class="switch"></span>
    </label>
  </div>

  <div id="empty" class="empty">Pick one or more photos. Everything happens on your phone; nothing is uploaded.</div>
  <div id="grid" class="grid"></div>
  <p id="hint" class="hint" hidden>Press and hold a photo to see the original.</p>
</main>

<div id="bar" class="bar" hidden>
  <button id="clear" class="ghost">Clear</button>
  <button id="saveAll" class="primary">Save all</button>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
